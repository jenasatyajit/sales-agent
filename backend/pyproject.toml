[project]
name = "pitch-simulator-backend"
version = "0.1.0"
description = "Backend for the B2B SaaS Customer Persona Pitch Simulator (Pipecat + Sarvam voice agent)"
requires-python = ">=3.11"
dependencies = [
    "pipecat-ai[webrtc,sarvam]>=1.14.0",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0",
    "aiosqlite>=0.20",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "python-dotenv>=1.0",
    # Imported directly by agent/evaluator.py (Sarvam's OpenAI-compatible chat completions);
    # also the client library pipecat's SarvamLLMService is built on.
    "openai>=1.50",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
